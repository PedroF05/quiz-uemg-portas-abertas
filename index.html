<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Quiz UEMG de Portas Abertas</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,Arial,sans-serif;background:#0b2a5b;color:#fff;min-height:100vh;display:flex;flex-direction:column}
header{padding:14px 28px;display:flex;justify-content:space-between;align-items:center;background:#08204a;font-weight:700;font-size:1.1rem}
header span{color:#ffd23f}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:18px;text-align:center}
h1{font-size:3rem;margin:0;color:#ffd23f}h2{font-size:2rem;margin:0}.sub{opacity:.8;font-size:1.2rem}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:14px 28px;font-weight:700;font-size:1.2rem;background:#ffd23f;color:#08204a}
button:hover{filter:brightness(1.1)}button.sec{background:#1d4a96;color:#fff}
input[type=text]{font:inherit;font-size:1.3rem;padding:10px 14px;border-radius:10px;border:0;width:260px;text-align:center}
.row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center}.cats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.cats label{background:#1d4a96;padding:8px 14px;border-radius:20px;cursor:pointer}
.score{display:flex;gap:30px;width:100%;max-width:1100px;justify-content:space-between}
.team{flex:1;padding:12px;border-radius:14px;background:#1d4a96;font-size:1.4rem;font-weight:700;border:4px solid transparent}
.team.on{border-color:#ffd23f;background:#2a63c4}.team b{display:block;font-size:2.4rem}
.q{font-size:2.2rem;font-weight:700;max-width:1000px}.cat{color:#ffd23f;font-weight:700;letter-spacing:2px;text-transform:uppercase}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:1100px}
.opt{background:#fff;color:#08204a;text-align:left;font-size:1.6rem;padding:20px}.opt i{font-style:normal;background:#08204a;color:#ffd23f;border-radius:8px;padding:2px 12px;margin-right:12px}
.opt.ok{background:#2ecc71;color:#fff}.opt.no{background:#e74c3c;color:#fff}.opt:disabled{cursor:default;filter:none}
.bar{width:100%;max-width:1100px;height:12px;background:#08204a;border-radius:6px;overflow:hidden}.bar div{height:100%;background:#ffd23f;width:100%}
.msg{font-size:1.5rem;min-height:2rem;font-weight:700}ol{font-size:1.4rem;text-align:left}
.hint{opacity:.6;font-size:.95rem}
</style></head><body>
<header><div>UEMG <span>De Portas Abertas</span></div><div id="hdr">Quiz</div></header>
<main id="app"></main>
<script src="perguntas.js"></script>
<script>
const $=s=>document.querySelector(s),app=$('#app'),TEMPO=20,PONTOS=10,BONUS=5,LETRAS=['A','B','C','D'];
let teams,fila,i,turno,timer,left,travado,total,cur;
const shuffle=a=>{a=[...a];for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ranking(){try{return JSON.parse(localStorage.getItem('rank')||'[]')}catch(e){return[]}}
function salvar(t){try{const r=ranking().concat(t.map(x=>({n:x.n,s:x.s}))).sort((a,b)=>b.s-a.s).slice(0,10);localStorage.setItem('rank',JSON.stringify(r))}catch(e){}}
function inicio(){
 const cats=[...new Set(PERGUNTAS.map(p=>p[0]))];
 const r=ranking().slice(0,5).map(x=>`<li>${esc(x.n)}: ${x.s} pts</li>`).join('');
 app.innerHTML=`<h1>Quiz UEMG 🎓</h1><div class="sub">Duas equipes, até 3 pessoas cada. Quem acertar mais, ganha!</div>
 <div class="row"><input id="n1" type="text" value="Equipe 1" maxlength="18"><input id="n2" type="text" value="Equipe 2" maxlength="18"></div>
 <div class="cats">${cats.map(c=>`<label><input type="checkbox" value="${c}" checked> ${c}</label>`).join('')}</div>
 <div class="row"><input id="ia" type="text" value="Sabichão" maxlength="14" title="Nome da IA" style="width:120px"><input id="tema" type="text" placeholder="Tema para a IA (vazio = banco offline)"><button id="mic" class="sec" style="padding:8px 16px;font-size:1rem">🎤 Falar</button></div>
 <div class="sub">Perguntas por partida: <select id="qt" style="font:inherit;font-size:1.2rem"><option>6</option><option selected>10</option><option>14</option></select></div>
 <button id="go">Começar!</button>
 ${r?`<div><b>🏆 Ranking do dia</b><ol>${r}</ol></div>`:''}
 <div class="hint">F = tela cheia · teclas 1–4 escolhem a resposta · Espaço = próxima</div>`;
 $('#hdr').textContent='Quiz';
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)$('#mic').style.display='none';else $('#mic').onclick=()=>{const rc=new SR();rc.lang='pt-BR';
  rc.onresult=e=>{let t=e.results[0][0].transcript;const m=t.toLowerCase().indexOf('tema');if(m>=0)t=t.slice(m+4);
   $('#tema').value=t.replace(/^[\s,:]+/,'').replace(/^(de|sobre)\s+/i,'').replace(/[.,]+$/,'')};
  rc.onend=()=>$('#mic').textContent='🎤 Falar';rc.onerror=rc.onend;$('#mic').textContent='🎙️ ouvindo…';rc.start()};
 $('#go').onclick=async()=>{const n1=$('#n1').value,n2=$('#n2').value,qn=+$('#qt').value;const cs=[...document.querySelectorAll('.cats input:checked')].map(c=>c.value);
  let pool=PERGUNTAS.filter(p=>cs.includes(p[0]));if(!pool.length)pool=PERGUNTAS;
  total=Math.min(+$('#qt').value,pool.length);fila=shuffle(pool).slice(0,total);
  const tema=$('#tema').value.trim(),ia=$('#ia').value.trim()||'IA';
  if(tema){app.innerHTML='<h1>🤖 '+esc(ia)+' está pensando…</h1><div class="sub">Criando perguntas sobre: '+esc(tema)+'</div>';
   try{const r=await fetch('/gerar',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({tema,n:qn})});
    if(!r.ok)throw 0;const d=await r.json();if(!d.length)throw 0;fila=d.map(x=>[tema,x.q,x.ok,x.err]);total=fila.length}
   catch(e){alert('A IA não respondeu. Usando o banco offline.')}}
  teams=[{n:n1||'Equipe 1',s:0},{n:n2||'Equipe 2',s:0}];i=0;turno=0;pergunta()}
}
function placar(){return `<div class="score">${teams.map((t,k)=>`<div class="team ${k===turno?'on':''}">${esc(t.n)}<b>${t.s}</b></div>`).join('')}</div>`}
function pergunta(){
 if(i>=fila.length)return fim();
 const [cat,q,ok,err]=fila[i];cur={ok,opts:shuffle([ok,...err])};travado=false;left=TEMPO;
 $('#hdr').textContent=`Pergunta ${i+1} de ${fila.length}`;
 app.innerHTML=`${placar()}<div class="cat">${cat} · vez de ${esc(teams[turno].n)}</div><div class="q">${esc(q)}</div>
 <div class="bar"><div id="b"></div></div>
 <div class="opts">${cur.opts.map((o,k)=>`<button class="opt" data-k="${k}"><i>${LETRAS[k]}</i>${esc(o)}</button>`).join('')}</div>
 <div class="msg" id="m"></div><button id="nx" class="sec" style="display:none"></button>`;
 document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>responder(+b.dataset.k));
 clearInterval(timer);timer=setInterval(()=>{left-=.1;$('#b').style.width=Math.max(0,left/TEMPO*100)+'%';if(left<=0)responder(-1)},100);
}
function responder(k){
 if(travado)return;travado=true;clearInterval(timer);
 const certo=k>=0&&cur.opts[k]===cur.ok;let msg;
 if(certo){const p=PONTOS+(left>TEMPO/2?BONUS:0);teams[turno].s+=p;msg=`✅ Acertou! +${p} pontos`}
 else msg=k<0?'⏰ Acabou o tempo!':'❌ Errou!';
 document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(cur.opts[j]===cur.ok)b.classList.add('ok');else if(j===k)b.classList.add('no')});
 $('#m').textContent=msg;$('.score').outerHTML=placar();
 const nx=$('#nx');nx.style.display='';nx.textContent=i+1>=fila.length?'Ver resultado':'Próxima (Espaço)';
 nx.onclick=()=>{i++;turno=1-turno;pergunta()};
}
function fim(){
 clearInterval(timer);salvar(teams);const[a,b]=teams;
 const t=a.s===b.s?'🤝 Empate!':`🏆 ${esc((a.s>b.s?a:b).n)} venceu!`;
 const r=ranking().slice(0,5).map(x=>`<li>${esc(x.n)}: ${x.s} pts</li>`).join('');
 $('#hdr').textContent='Fim de jogo';
 app.innerHTML=`<h1>${t}</h1><div class="score">${teams.map(t=>`<div class="team">${esc(t.n)}<b>${t.s}</b></div>`).join('')}</div>
 <div><b>🏆 Ranking do dia</b><ol>${r}</ol></div><button id="again">Nova partida</button>`;
 $('#again').onclick=inicio;
}
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
 if(e.key==='f'||e.key==='F'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}
 else if(['1','2','3','4'].includes(e.key)&&cur&&!travado&&fila&&i<fila.length&&$('.opt'))responder(+e.key-1);
 else if(e.key===' '&&$('#nx')&&$('#nx').style.display!=='none'){e.preventDefault();$('#nx').click()}
});
inicio();
</script></body></html>
