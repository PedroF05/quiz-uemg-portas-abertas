[project]
name = "quiz-uemg-portas-abertas"
version = "0.1.0"
description = "Quiz do evento UEMG de Portas Abertas"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "langchain>=1.0",
  "langchain-google-genai>=3.0",
  "langchain-huggingface>=1.0",
  "langchain-ollama>=1.0",
  "qrcode[pil]>=7.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
